# ----------------------- CORE CONFIGURATION -----------------------

set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

bind L send-keys "clear" \; send-keys "Enter"

# ----------------------- PLUGINS -----------------------

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'vaaleyard/tmux-dotbar' # minimal dotbar
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# ------------------- PERSISTENCE -----------------------

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @continuum-save-interval '5'

# ----------------------- STYLE -----------------------

set -g window-status-current-style default
set -g session-status-current-style default

set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#6a6a6a"
set -g @tmux-dotbar-fg-current "#cdd6f4"
set -g @tmux-dotbar-fg-session "#fafafa"
set -g @tmux-dotbar-fg-prefix "#ee9025"

set -g popup-style "bg=default"
set -g popup-border-style "bg=default"

set -g pane-border-style "bg=default,fg=#6a6a6a"
set -g pane-active-border-style "bg=default,fg=#ee9025"

set -g tree-mode-border-style "bg=default,fg=default"
set -g tree-mode-preview-style "bg=default,fg=#ee9025"
set -g tree-mode-selection-style "bg=default,fg=#ee9025"

# ----------------------- TPM -----------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
