# ----------------------- CORE CONFIGURATION -----------------------

set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

bind L send-keys "clear" \; send-keys "Enter"

# ----------------------- PLUGINS -----------------------

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl

# ------------------- PERSISTENCE -----------------------

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @continuum-save-interval '5'

# ----------------------- LUMON STYLE -----------------------

# Global Bar Settings
set -g status-position top
set -g status-justify left
set -g status-bg "#0A1520"
set -g status-fg "#5AC8D8"
set -g status-left-length 50
set -g status-right-length 100

set -g pane-border-style "fg=#143040,bg=default"          
set -g pane-active-border-style "fg=#2A5A70,bg=default"

# Message / Command Prompt style (When hitting Prefix + :)
set -g message-style "fg=#BFFFFF,bg=#122838,bold"

# Left Side: Current Work Session Clearance
set -g status-left "#[fg=#2A5A70][#[fg=#F0CD66,bold]SYS_WS:#S#[fg=#2A5A70]] #[fg=#143040]│ "

# Right Side: Shows active pane index, continuum status code, and the corporate shift time
set -g status-right "#[fg=#2A5A70][#[fg=#88EEFF]PANE:#P#[fg=#2A5A70]] #[fg=#2A5A70][#[fg=#88FF99]MDR_OK#[fg:#2A5A70]] #[fg=#2A5A70][#[fg=#7EE6F2,bold]%R#[fg=#2A5A70]]"

# Window Tabs: Formatted as structured Data Batches
# Inactive Window Tab
set-window-option -g window-status-style "fg=#1A3848,bg=default"
set-window-option -g window-status-format "#[fg=#1E455A]▱ #[fg=#2A5A70]#I:#W"

# Active Window Tab (The file currently under review)
set-window-option -g window-status-current-style "fg=#7EE6F2,bg=default,bold"
set-window-option -g window-status-current-format "#[fg=#7EE6F2]▰ #[fg=#BFFFFF,bold]#I:#W"

# Clock mode color (Prefix + t)
set-window-option -g clock-mode-colour "#7EE6F2"

# Copy Mode Selection Highlight color
set-window-option -g mode-style "fg=#BFFFFF,bg=#122838"
# ----------------------- TPM -----------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
